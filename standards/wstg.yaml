# Pinned authoritative WSTG identifier list.
#
# Generated from the OWASP WSTG project's own checklist, not from memory. Every
# `refs.wstg` value in knowledge/ is resolved against this file. A wrong identifier
# reads perfectly well in a diff -- WSTG-AUTHZ-* for what is actually WSTG-ATHZ-*
# is the canonical example -- so it is checked mechanically instead.
#
# WSTG is a coverage skeleton here, not the table of contents. It proves nothing
# standard is missing; it does not bound the scope. See docs/TAXONOMY.md section 5.
#
# Only identifiers and official test titles are recorded here. WSTG is CC BY-SA;
# no WSTG prose is reproduced anywhere in this repository.
#
# This file is generated. Do not hand-edit it -- correct the source or the
# generator instead, so the pin below stays true.
#
# Refresh procedure:
#   1. git ls-remote https://github.com/OWASP/wstg master        -> new source_commit
#   2. curl -sO https://raw.githubusercontent.com/OWASP/wstg/<commit>/checklists/checklist.md
#   3. sha256sum checklist.md                                    -> new source_sha256
#   4. Regenerate this file, update the three pin fields, and review the diff.
#      A diff with no ID changes is a title-wording change and is safe. A diff
#      that adds or removes an ID means the refs.wstg values in knowledge/ need review.
#
# The pin is what makes this file auditable. Anyone can re-fetch the exact bytes
# it was built from:
#   curl -s https://raw.githubusercontent.com/OWASP/wstg/<source_commit>/checklists/checklist.md | sha256sum
# and compare against source_sha256. A branch name alone could not do that --
# `master` moves, so it names a moving target rather than the evidence.
