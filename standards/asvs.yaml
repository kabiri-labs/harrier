# Pinned OWASP ASVS identifiers.
#
# Generated from the ASVS project's own machine-readable release, not from
# memory. Every `refs.asvs` value in knowledge/ and mitigations/ is resolved
# against this file.
#
# WHAT IS AND IS NOT HERE. ASVS 5.0.0 is licensed CC BY-SA 4.0 -- share-alike.
# Reproducing its requirement text would force share-alike onto this repository,
# so only identifiers, chapter and section names, and the verification level are
# recorded. The requirement text is deliberately absent: an ASVS reference here
# is a pointer for report writing, and remediation prose in mitigations/ is
# written originally.
#
# This file is generated. Do not hand-edit it -- a hand-edit would make the
# verification claim below empty.
#
# Refresh procedure:
#   1. git ls-remote https://github.com/OWASP/ASVS 'refs/tags/*'   -> new source_commit
#      Pin the TAG's commit, never the branch. A branch named v5.0.0 also exists
#      and moves; the tag v5.0.0_release is the release.
#   2. curl -sO https://raw.githubusercontent.com/OWASP/ASVS/<commit>/<path>
#   3. sha256sum the file                                          -> new source_sha256
#   4. Regenerate, update the pin fields, and review the diff. A diff that adds
#      or removes a shortcode means refs.asvs values need review.
#
# Anyone can re-fetch the exact bytes this was built from and compare:
#   curl -s https://raw.githubusercontent.com/OWASP/ASVS/<source_commit>/<source_path> | sha256sum
