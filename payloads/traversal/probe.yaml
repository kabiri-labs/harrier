# Establishing that a parameter names a path at all, before spending anything on
# depth or encoding. Every entry here resolves back inside the intended
# directory: this file is what makes the first unit safe to run before anything
# is known about the target, and an entry that could read something unintended
# does not belong in it.
#
# {{FILE}} is the resource the unmodified request asks for. {{DIR}} is a
# directory that is known to exist -- see the up-and-back entry, which cannot be
# run without one.
id: traversal/probe
reviewed: "2026-08-25"
title: Traversal survival probes
variables: [FILE, DIR]
credits:
  - "Traversal probing is long-standing public technique; every entry here is written for this project."
entries:
  - name: baseline
    payload: "{{FILE}}"
    detect: "The unmodified request. Record status, length and content type -- every entry below is read against this and nothing else."

  - name: same-directory no-op
    payload: "./{{FILE}}"
    detect: "Identical response to the baseline means the value reaches a path resolver that normalises. A 404 means it does not: the value is a key, not a path."
    note: "The strongest single probe in this file, and the only one that needs nothing known about the target. It separates a path from an identifier without leaving the intended directory."

  - name: up-and-back no-op
    payload: "{{DIR}}/../{{FILE}}"
    detect: "Identical to the baseline proves traversal sequences are resolved rather than rejected, while still resolving inside the intended root."
    note: >-
      {{DIR}} must be a directory that actually exists. A POSIX resolver walks
      the path component by component and fails on a missing directory before it
      ever reaches the .. -- so an invented name returns not-found from a
      perfectly vulnerable sink, and reads as a negative result. Take the name
      from a path the application itself serves. Where none is known, this probe
      is unavailable and the same-directory no-op is the whole of the answer.

  - name: separator sensitivity
    os: [windows]
    payload: ".\\{{FILE}}"
    detect: "A baseline response to the back-separator form says the resolver is Windows, or a Windows-aware library on any host."
