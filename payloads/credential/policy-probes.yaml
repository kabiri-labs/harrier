# Credentials chosen to find the boundary the application actually enforces,
# which is rarely the one the page describes.
#
# Probes, not guesses. Every entry here is a value the tester sets on an account
# they control, to learn what the form accepts; none of them is a candidate for
# somebody else's password, and there is deliberately no list of those anywhere
# in this repository. What separates the two is the direction: this file is
# written to a form, never tried against a login that is not the tester's.
#
# The order matters. A single character answers the minimum in one request; the
# rest are only worth sending once that has come back, because each of them
# tests a rule that only exists if the first was refused.
id: credential/policy-probes
reviewed: "2026-09-05"
title: Credential policy boundary probes
# ACCOUNT is the identifier of the account under test; SEVENTY_TWO is any
# 72-byte string the tester composes; OVER_MAXIMUM is one byte past whatever
# maximum the form states, or 200 bytes where it states none.
variables: [ACCOUNT, SEVENTY_TWO, OVER_MAXIMUM]
safety: >-
  Every probe is set on an account the tester owns, on a surface the engagement
  scoped. Two things are not in this file and need the client's agreement
  before either is attempted: setting a credential on an account belonging to
  somebody else, and sending any of these to a login form as a guess. The first
  changes a real user's access; the second spends that user's lockout budget,
  and lockout is a control this catalogue models rather than a cost worth
  paying to confirm a policy.
credits:
  - "The 72-byte bcrypt boundary is documented behaviour of the algorithm; the probe set and its ordering are written for this project."
entries:
  - name: single character
    payload: "a"
    detect: "Accepted, or an error naming a minimum length."
    note: >-
      The whole minimum-length question in one request. Send it first: every
      other probe in this file tests a rule that only exists if this was refused.

  - name: repeated character at the stated minimum
    payload: "aaaaaaaa"
    detect: "Accepted where the single character was refused."
    note: >-
      Separates a length rule from a composition rule. Accepted here means the
      minimum is the only rule; refused means something else is also checked,
      and the next two probes say what.

  - name: length without variety
    payload: "aaaaaaaaaaaaaaaaaaaa"
    detect: "Accepted, which means length alone satisfies the policy."
    note: >-
      A long credential with one distinct character. A policy that accepts this
      is measuring length rather than unpredictability, which is the difference
      between the published rule and the enforced one.

  - name: variety without length
    payload: "Aa1!Aa1!"
    detect: "Accepted, which means the composition rule is the only rule."
    note: >-
      The mirror of the entry above. Both accepted means neither rule is doing
      the work the published policy claims.

  - name: the username itself
    payload: "{{ACCOUNT}}"
    detect: "Accepted as the credential for the account it names."
    note: >-
      Whether the credential is checked against the identity it protects. This
      is a rule most published policies claim and fewer implement.

  - name: bcrypt boundary, matching prefix
    payload: "{{SEVENTY_TWO}}Z"
    detect: >-
      Set this, then sign in with the first 72 bytes alone. Success means the
      tail was discarded.
    note: >-
      bcrypt hashes the first 72 bytes and silently ignores the rest, so a
      passphrase longer than that is exactly as strong as its first 72 bytes and
      the user is never told. Prove it by signing in with the truncated form,
      never by reading a length limit off the page.

  - name: over the stated maximum
    payload: "{{OVER_MAXIMUM}}"
    detect: >-
      Rejected with a stated maximum, or accepted -- in which case sign in with
      a prefix to find where it was cut.
    note: >-
      Silent truncation and honest rejection look identical at the form. Only
      the sign-in afterwards separates them.

  - name: leading and trailing whitespace
    payload: "  correct horse  "
    detect: "Accepted, then sign in with the trimmed form."
    note: >-
      Whether the value is trimmed before hashing. If it is, the stored secret
      is not the one the user typed, and a user who pads deliberately loses the
      padding without being told.

  - name: unicode normalisation
    payload: "café"
    detect: "Set in one normal form, then sign in with the other."
    note: >-
      The same characters in NFC and NFD are different bytes. An application
      that normalises on one surface and not another accepts the credential in
      one place and refuses it in the next.
