# Dimension vocabularies.
#
# A dimension is an axis that changes only *how* a unit is performed -- payload
# syntax, delivery position, engine quirk -- not what proves it. Splitting a unit
# on a dimension is the mistake that turns seven SQL injection techniques into
# thirty-five unusable rows. See docs/ARCHITECTURE.md section 3.
#
# Dimension values are matched against this file. A value outside it narrows a
# dimension to nothing, which silently removes content from the published
# artefact -- a mistyped engine name must fail loudly instead.
#
# Descriptions record what the value changes about a payload, because that is the
# only reason the value exists here. Engine and browser behaviour is volatile
# content: revisit it rather than trusting it.
version: 1
reviewed: "2026-08-24"
dimensions:
  engine:
    label: Relational database engine
    values:
      - value: mysql
        label: MySQL / MariaDB
        note: "Backtick identifier quoting; no FROM requirement in a SELECT."
      - value: postgresql
        label: PostgreSQL
        note: "Strict type matching across UNION arms; rich built-in information functions."
      - value: mssql
        label: Microsoft SQL Server
        note: "Stacked queries available over most drivers, which widens the technique set."
      - value: oracle
        label: Oracle Database
        note: "Every SELECT requires a FROM clause, so payload shapes differ structurally."
      - value: sqlite
        label: SQLite
        note: "Permissive typing; a reduced metadata surface compared with server engines."

  document_store:
    label: Document and key-value store
    values:
      - value: mongodb
        label: MongoDB
        note: "Operator injection through structured query documents rather than concatenated text."
      - value: redis
        label: Redis
        note: "Reached indirectly through cache keys and session storage rather than a query parameter."

  browser:
    label: Browser engine
    values:
      - value: chromium
        label: Chromium
        note: "Blink parsing and its sanitiser behaviour."
      - value: firefox
        label: Firefox
        note: "Gecko parsing; historically differs on markup recovery and URI scheme handling."
      - value: webkit
        label: WebKit
        note: "Safari and every iOS browser; differs on both parsing and CSP enforcement detail."

  delivery:
    label: How the payload reaches the sink
    values:
      - value: reflected
        label: Reflected
        note: "Returned in the response to the request that carried it."
      - value: stored
        label: Stored
        note: "Persisted and returned later, possibly to another user, possibly in another context."
      - value: dom
        label: DOM
        note: "Never reaches the server; written to a sink by client-side script."

  operation:
    label: State-changing operation on an object
    values:
      - value: update
        label: Update
        note: "Modifies an existing record; often the only write path the authorization check was written against."
      - value: delete
        label: Delete
        note: "Frequently a separate handler from update, and frequently a separate policy."
      - value: create
        label: Create
        note: "Ownership is assigned rather than checked, so the check that refuses the other two may not exist here at all."

  selection:
    label: How a GraphQL query names the field it wants
    values:
      - value: direct
        label: Direct selection
        note: "The field named at the top level, which is the shape most authorization middleware inspects."
      - value: alias
        label: Alias
        note: "The same field under another response key; a check keyed on the response name misses it."
      - value: fragment
        label: Fragment
        note: "Selected through a named or inline fragment, which a check walking only the top-level selection set never reaches."
      - value: nested
        label: Nested path
        note: "Reached as a child of another type, where the parent's authorization is the only one applied."

  os:
    label: Operating system resolving the path
    values:
      - value: unix
        label: Unix-like
        note: "Forward separators; the readable proof files are text and world-readable by default."
      - value: windows
        label: Windows
        note: "Back separators, drive letters and UNC paths; case-insensitive, and a trailing dot or space is stripped by the filesystem."

  signature:
    label: How an issued token is signed
    values:
      - value: hmac
        label: Shared secret (HMAC)
        note: "One key both signs and verifies, so recovering it offline makes every property the signature carried the tester's to choose."
      - value: rsa
        label: RSA
        note: "Signing key is never held by the verifier; offline recovery from a captured token is not a route."
      - value: ecdsa
        label: ECDSA
        note: "As RSA for reachability; nonce reuse rather than key strength is where its failures live."

  platform:
    label: Server-side platform
    values:
      - value: php
        label: PHP
      - value: java
        label: Java / JVM
      - value: dotnet
        label: .NET
      - value: python
        label: Python
      - value: nodejs
        label: Node.js
      - value: ruby
        label: Ruby
