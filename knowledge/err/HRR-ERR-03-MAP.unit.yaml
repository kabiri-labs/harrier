id: HRR-ERR-03-MAP
topic: HRR-ERR-03
status: sketched
role: stage
kind: recon
title: "The artefacts the application delivers"
objective: >-
  Record which artefacts the application serves alongside its pages --
  scripts, source maps, documents, generated files -- since each is content it
  chose to deliver and may not have read.

requires:
  all_of: [recon.entrypoints.mapped]

hypotheses:
  - "The application delivers files it never read, because a build pipeline put them there rather than a person."
  - "An artefact the application generates carries whatever was in memory when it was written, which is more than the page it accompanies shows."
  - "Third-party assets served from the application's own paths look exactly like the application's own, and describe somebody else."

triage:
  - "Bundles that ship a source map alongside them."
  - "Documents and exports the application generates rather than ships."
  - "Assets whose naming carries a build, a branch or a version marker."

sequence:
  - "From the entry point inventory, list everything the application serves that is not a page: scripts, stylesheets, source maps, documents, generated exports, images produced from user data."
  - "Fetch each one and record its type, its size and where it came from, rather than opening it here."
  - "Note which of them the application generates rather than ships, since a generated artefact carries whatever was in memory when it was written."

first_false_positive: >-
  A third-party asset served from the application's own path. It is content the
  application delivers and not content the application wrote, so it is recorded
  with its origin: reading a vendor bundle for the target's internals wastes the
  pass.

done_when: >-
  Every non-page artefact the application serves is recorded with its type, its
  size and whether the application ships it or generates it.
