id: PTN-ERR-04-PROBE
topic: PTN-ERR-04
status: sketched
role: stage
title: "Content exposed publicly that the application no longer serves"
objective: >-
  Determine whether any indexed or archived copy exposes content the
  application has since withdrawn or never meant to publish.

requires:
  all_of: [recon.paths.indexed]
yields: [control.content.withdrawn, primitive.stored.read]
closes: [control.content.withdrawn]

hypotheses:
  - "Something was withdrawn because it should not have been public, and withdrawal does not reach the holders."
  - "A credential exposed once is often still accepted, because rotating one is work and deleting a page is not."
  - "A system never meant to be public is indexed anyway, because nothing told the crawler otherwise."

triage:
  - "Copies whose URL the target no longer serves at all."
  - "Values shaped like credentials, keys or internal endpoints inside a held copy."
  - "Pages from a system whose naming suggests it was never the public interface."

oracle:
  positive: "A copy held publicly carries content the application does not serve now and would not have chosen to publish -- a credential, an internal endpoint, a document withdrawn from the site, or a page from a system that was never meant to be public."
  negative: "Every held copy was read, and each holds only content the application still publishes."

sequence:
  - "Read each held copy for the same four shapes a delivered artefact is read for, and for pages the application no longer serves at all."
  - "Request the original URL from the target and compare: content the target has withdrawn while the holder retains it is the finding this unit is for."
  - "Check whether anything found is still live -- a credential still accepted, an endpoint still answering -- since withdrawn and rotated are different results."
  - "Record each finding with the holder, the copy's date, and what the target answers for the same URL today."

first_false_positive: >-
  A cached copy of a page the target still serves. The copy is old, the content
  is public, and nothing was disclosed -- which is why every candidate is
  compared against what the same URL returns now before it is recorded.

done_when: >-
  Every held copy is read and recorded as matching what the target serves, as
  withdrawn content the holder retains, or as content never meant to be public,
  with what the URL answers today beside it.
