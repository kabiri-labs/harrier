id: HRR-INJ-01-BOOL
topic: HRR-INJ-01
status: authored
role: variant
title: "Boolean-based inference"
objective: >-
  Determine whether a condition the tester controls produces two reliably
  distinguishable responses from the same request.

requires:
  all_of: [surface.sql.injectable]
motivated_by: [recon.query.structure]
yields: [primitive.db.read]

hypotheses:
  - "The statement's result set decides something visible -- a row count, a redirect, a rendered field -- so a condition the tester writes moves it."
  - "Where the body is identical the branch still shows in a status, a header or a cookie the page sets on one path only."
  - "The endpoint caches, so a stable difference between two forms can be an artefact of which request was served from where."

triage:
  - "Endpoints whose response visibly depends on whether a record was found: a profile page, a lookup, a 'no results' branch."
  - "A parameter confirmed injectable where errors are suppressed and no value is rendered."
  - "Two ordinary values of the parameter whose responses differ by a fixed length, which is the differential the technique will read."

sink: >-
  The predicate the statement evaluates, where a condition the tester wrote is
  combined with the application's own.

enter_when:
  - "The parameter is confirmed injectable and neither an error message nor a UNION arm returned a computed value."

oracle:
  positive: "The always-true and always-false forms of one request return two reproducibly different responses, and the true form reproduces the unmodified baseline."
  negative: "Ten alternating repetitions of each form produce no difference larger than the endpoint's own variation between identical requests."
  inconclusive: "The endpoint's variation between identical requests is larger than the differential being read."

sequence:
  - "Measure the endpoint's own variation first: ten baseline requests, recording the spread of status, length and rendered content."
  - "Send the true and false forms of one condition, and confirm the true form reproduces the baseline."
  - "Alternate the pair three times where a difference appeared, to rule out ordering and caching as its source; where none appeared, take the alternation to ten before recording a negative, since ruling the channel out costs more evidence than confirming it."
  - "Read one short value through the channel -- the engine version, not a table of rows -- and stop."

first_false_positive: >-
  A difference produced by the payload's own length rather than by its truth.
  Two conditions of unequal length move a reflected query string or a rendered
  counter, so both forms are padded to the same length before either is sent.

false_positives:
  - "A cached response for one of the two forms, which manufactures a stable differential from two requests that never both reached the database."
  - "A rate limiter answering the second form differently because it was second rather than because it was false."

preconditions:
  - "The endpoint answers deterministically enough that its own variation is smaller than the differential being read."

evidence:
  - "The ten baseline responses establishing the endpoint's variation."
  - "The alternating true and false pairs, and the value read out of them."

done_when: >-
  The true and false forms are recorded as distinguishable or not, with the
  repetition count and the baseline variation they were read against.

safety: >-
  A character costs a binary search, not a request: roughly seven comparisons
  for an ASCII character, plus the requests that bound the value's length. A
  thirty-character version string is therefore around two hundred requests
  before any repetition, and a table is tens of thousands against a production
  database -- which reads as an attack in every log that sees it. Prove the
  channel with one short value; extracting anything larger is a decision to put
  to the client rather than the next step of a procedure.

payloads: payloads/sqli/boolean.yaml
tools: [burp-repeater, burp-intruder]
card: cards/sqli/inference.md
mitigation: mitigations/parameterised-query.md
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]
