id: PTN-INJ-01-STACK
topic: PTN-INJ-01
status: authored
role: variant
title: "Stacked statement execution"
objective: >-
  Determine whether a second statement, separated from the first, is executed
  by the driver rather than rejected.

requires:
  all_of: [surface.sql.injectable]
motivated_by: [recon.engine.identified, control.filter.identified]
yields: [primitive.db.write]

hypotheses:
  - "The driver rather than the engine decides whether a second statement runs, so the answer is a property of the deployment and not of the product."
  - "The second statement returns nothing to the response even when it executes, so the proof has to be read somewhere other than the body."
  - "A statement that proves execution without changing anything exists on every engine that permits a batch at all."

triage:
  - "MSSQL, PostgreSQL and MySQL behind drivers that permit multiple statements; a .NET or PHP deployment is where this most often answers."
  - "An injection point in a write path, where a second statement is closer to what the application already does."
  - "A parameter where the statement separator survives the filter, which is the first thing to establish."

sink: >-
  The batch the driver submits, where a separator the tester wrote makes the
  second statement the tester's rather than the application's.

enter_when:
  - "The parameter is confirmed injectable and the engine is one whose driver may permit a batch."

oracle:
  positive: "A second statement whose only effect is measurable -- a timed delay is the safest -- executes, while the identical batch with the separator removed does not."
  negative: "Every separator form is rejected or ignored, and the observable the second statement would have produced never appears."
  inconclusive: "The separator is removed upstream, so the driver's own behaviour was never put to the test."

sequence:
  - "Establish that the separator survives to the statement, using the evasion unit's recorded forms where it does not."
  - "Append a second statement whose only effect is a measurable delay, and compare against the identical batch with the separator removed."
  - "Where a delay is unavailable, write to a scratch location the engagement created, and never to application data."
  - "Record that a second statement executes, and stop there."

first_false_positive: >-
  The first statement rather than the second producing the observable. A
  condition appended to the original predicate delays a response exactly as a
  stacked delay does, which is why the control is the identical batch with only
  the separator removed.

false_positives:
  - "A driver that accepts the batch, executes the first statement and silently discards the rest, which is indistinguishable from acceptance in the response."
  - "An ORM that re-parses and rejects the batch after the application has already recorded it as sent."

preconditions:
  - "A scratch location the engagement owns, if anything is to be written at all."
  - "Written agreement covering execution beyond a read, because the capability this establishes is a write."

evidence:
  - "The batch, the control without the separator, and the observable that differed between them."

done_when: >-
  The deployment is recorded as executing a second statement or not, with the
  separator form and the control that decided it.

safety: >-
  This unit establishes a write capability and the proof must not exercise it.
  Nothing here touches application data: no insert into a real table, no update,
  no schema change, and no destructive statement of any kind. A delay is the
  proof. Where a write is genuinely the only available observable it goes into a
  table the engagement created, and it is named in the report.

payloads: payloads/sqli/stacked.yaml
tools: [burp-repeater]
card: cards/sqli/injection-points.md
mitigation: mitigations/parameterised-query.md
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]
