id: HRR-INJ-01-EVADE
topic: HRR-INJ-01
status: authored
role: stage
kind: recon
title: "Filter and encoding evasion"
objective: >-
  Determine whether a negative result from another technique is caused by a
  filter rather than by the absence of an injection.

requires:
  all_of: [surface.sql.injectable]
motivated_by: [recon.intermediary.identified]
yields: [control.filter.identified]

hypotheses:
  - "A filter sits between the tester and the statement and inspects a different encoding of the request from the one the application parses."
  - "A filter that strips rather than rejects does not re-examine its own output, so a payload can be written to become valid only after the filter has run."
  - "The refusal comes from an intermediary rather than from the application, in which case the result belongs against the tier and not against the parameter."

triage:
  - "A connection reset, a 403 carrying a product's own body, or a redirect the application never issues."
  - "A payload accepted with one keyword and refused with another, which is a signature list rather than a parser."
  - "A tier map already recording a proxy, a delivery network or a filtering appliance in front of the origin."

enter_when:
  - "Another unit of this topic returned a negative result whose refusal could have come from anywhere between the tester and the statement."

sequence:
  - "Send one payload in the encodings each layer decodes differently, one layer at a time, and record which form reaches the statement."
  - "Replace keywords with equivalents the grammar accepts -- a comment inside the token, case variation, an alternative operator -- to separate a signature list from a parser."
  - "Send a form that becomes valid only after a stripping filter has run on it, which no rejecting filter can produce."
  - "Attribute the refusal to a layer, and record the surviving form so the other units can be re-run with it."

first_false_positive: >-
  A refusal recorded against the application when it belonged to an
  intermediary. A connection dropped before any status is not a decision the
  application ever took, and filing it against the parameter turns an
  unanswered question into a clean result.

preconditions:
  - "At least one negative result from another unit of this topic, which is the thing this unit exists to explain."

evidence:
  - "The payload in each encoding, with the layer that answered it."
  - "The surviving form, recorded so the other units can be re-run against it."

done_when: >-
  Each refusal is attributed to a layer, and either a surviving payload form is
  recorded or every encoding is recorded as refused with the layer that refused
  it.

payloads: payloads/sqli/evasion.yaml
tools: [burp-repeater, burp-intruder]
card: cards/sqli/injection-points.md
mitigation: mitigations/parameterised-query.md
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]
