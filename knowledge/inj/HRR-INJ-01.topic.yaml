id: HRR-INJ-01
title: "SQL injection"
domain: INJ
axis: technique

surfaces:
  any_of: [sql-backed-param]

# The engine changes payload syntax and nothing else: the same seven techniques
# apply, and each one's oracle is identical across all five. Splitting on it
# would produce thirty-five units where seven are needed.
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]

boundaries:
  - subject: "Operator injection against a document store"
    home: null
    note: >-
      The payload is a structured operator rather than a concatenated SQL
      fragment. Not yet written; recorded so the gap stays visible.
  - subject: "Injection into an LDAP filter"
    home: HRR-INJ-02
    note: >-
      A different interpreter with different metacharacters and no SQL
      grammar.

see_also: [HRR-INJ-02, HRR-INJ-05, HRR-INJ-12]

order:
  - HRR-INJ-01-PROBE
  - HRR-INJ-01-FPRINT
  - HRR-INJ-01-ERROR
  - HRR-INJ-01-BOOL
  - HRR-INJ-01-TIME
  - HRR-INJ-01-UNION
  - HRR-INJ-01-OOB
  - HRR-INJ-01-STACK
  - HRR-INJ-01-SECOND
  - HRR-INJ-01-EVADE

