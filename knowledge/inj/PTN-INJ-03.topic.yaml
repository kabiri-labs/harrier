id: PTN-INJ-03
title: "XML injection and entity expansion"
domain: INJ
axis: technique

surfaces:
  any_of: [xml-ingest]

boundaries:
  - subject: "Where the parser's outbound fetch can reach"
    home: PTN-RES-03
    note: >-
      That entities resolve at all is an XML finding and stays here -- an
      out-of-band interaction is how blind resolution is detected. What that
      fetch can then reach, and whether its body comes back, is server-side
      request forgery and is recorded once, there. The two are separately
      recordable: egress filtering can leave resolution confirmed and reach
      clean.

see_also: [PTN-RES-03]

