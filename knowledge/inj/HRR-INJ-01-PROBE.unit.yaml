id: HRR-INJ-01-PROBE
topic: HRR-INJ-01
status: authored
role: stage
title: "Injection point probe"
objective: >-
  Determine whether a syntax-breaking character alters the query's result or
  its error behaviour in a way the same request without it does not.

requires:
  any_of: [access.anon, access.user]
yields: [surface.sql.injectable]
closes: [surface.sql.injectable]

hypotheses:
  - "The parameter is concatenated into the statement rather than bound to a placeholder, so a quote ends the literal early."
  - "The value sits in a position the grammar constrains -- a sort column, a page size, a table name -- where no quote is needed and a quote proves nothing."
  - "The application catches the exception and answers normally, so the difference is a changed result set rather than an error."

triage:
  - "Parameters carrying a record identifier, a sort key or a page size: id, uid, order, sort, dir, limit, offset, q, filter."
  - "Endpoints that list, search, sort or paginate, where the value reaches a WHERE, ORDER BY or LIMIT clause."
  - "Values the client sends and never displays: a hidden field, a cookie the server reads, a JSON field the interface fills in."
  - "A response whose row count moves when the parameter moves, which is the statement talking rather than the template."

sink: >-
  The statement the driver receives, with the parameter's value already
  concatenated into its text rather than bound to a placeholder.

enter_when:
  - "A parameter reaches a listing, a lookup, a sort or a page size, and its ordinary behaviour has been observed at least once."

oracle:
  positive: "The single quote and its balanced equivalent produce two different responses, and the balanced form returns to the baseline -- the value was parsed as SQL rather than compared as text."
  negative: "Every string, numeric and identifier form leaves the response identical to the baseline, the arithmetic pair included."
  inconclusive: "The endpoint answers with one generic page for every value including the baseline, so nothing distinguishes a parse from a rejection."

sequence:
  - "Capture the baseline three times and record status, length and elapsed time; a non-deterministic endpoint invalidates every comparison below."
  - "Send a single quote, then the balanced form. A difference followed by a return to the baseline is the string-context signal."
  - "For a numeric position, send an arithmetic pair that evaluates to the original value -- 7-6 where the value is 1 -- and compare it against the literal."
  - "Where neither moves, send the boolean pair into a sort column or a sort direction, which is the identifier position no quote reaches."
  - "Record the position and its context. Choosing a technique from it belongs to the sibling units."

first_false_positive: >-
  A filter or an error page answering the single quote. The response changed,
  and it changed upstream of the statement -- which is why the balanced form is
  sent in the same breath: a signature filter refuses both, and a parser accepts
  the second.

false_positives:
  - "A generic error page returned for every malformed value, which makes the quote look meaningful and the arithmetic pair look inert."
  - "A cache serving the baseline response to the modified request, so every payload appears accepted."
  - "Type validation in the framework, which refuses a non-numeric value before any statement is built."

preconditions:
  - "The endpoint answers deterministically: three identical requests produce three identical responses."

evidence:
  - "The baseline, the quote and the balanced-form responses, side by side."
  - "For a numeric position, the literal and the arithmetic pair that should be equivalent."

done_when: >-
  The parameter is recorded as string context, numeric context, identifier
  context, or not injectable, with the pair of responses that decided it.

safety: >-
  Every payload here reads the statement's own behaviour. Nothing appends a
  clause, nothing terminates the statement and nothing runs a second one, which
  is why this unit runs before any decision about the target has been taken.

payloads: payloads/sqli/probe.yaml
tools: [burp-repeater, curl]
card: cards/sqli/injection-points.md
mitigation: mitigations/parameterised-query.md
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]
