id: HRR-INJ-01-TIME
topic: HRR-INJ-01
status: authored
role: variant
title: "Time-based inference"
objective: >-
  Determine whether a conditional delay the tester injects is reproducibly
  observable in response latency.

requires:
  all_of: [surface.sql.injectable]
yields: [primitive.db.read]

hypotheses:
  - "Nothing the statement returns reaches the response, but the statement is still executed, so the only observable left is how long it takes."
  - "The delay function the engine offers is callable by the account the application connects as, which is a grant rather than a product feature."
  - "The path between tester and application varies on its own, so the injected interval has to clear that variation rather than merely exist."

triage:
  - "A parameter confirmed injectable where error, boolean and UNION routes each returned nothing."
  - "Write endpoints -- an insert, an update, a queue submission -- which return nothing whatever happens inside them."
  - "An endpoint whose response time already varies by well under a second between identical requests."

sink: >-
  The statement the database executes whether or not anything it returns ever
  reaches the response body.

enter_when:
  - "The error, boolean and UNION routes have each been recorded as producing nothing."

oracle:
  positive: "The delayed form exceeds the baseline by at least the injected interval across repetitions, and the identical payload with the delay disabled does not."
  negative: "The delayed form and its control are indistinguishable across ten repetitions at an interval well above the measured jitter."
  inconclusive: "The endpoint's own latency spread is wider than the largest interval that can safely be injected."

sequence:
  - "Measure the endpoint ten times unmodified and record the spread; this is the floor the interval has to clear."
  - "Send the conditional delay with a true condition, then the identical payload with the condition false as the control."
  - "Alternate the pair five times and compare medians rather than any single reading."
  - "Prove one bit of a value through the same channel, and stop."

first_false_positive: >-
  A delay produced by the payload's own cost rather than by the injected
  interval -- a forced full scan, a heavy sort, a large IN list. The control is
  the identical payload with the delay disabled, which is the only thing that
  separates the two.

false_positives:
  - "Network or proxy variation larger than the interval, read as signal because the requests happened to fall in a convenient order."
  - "Pool contention from an earlier delayed request, which slows the control form sent after it and makes a false condition read as true."

preconditions:
  - "The engagement window permits holding a backend connection open per request, and the client has agreed to it."
  - "The delay function is callable by the database account, which differs by engine and by grant."

evidence:
  - "The ten unmodified timings establishing the jitter floor."
  - "The alternating delayed and control timings, with the medians compared."

done_when: >-
  The delayed and control forms are recorded as distinguishable or not, with
  the jitter floor, the interval used and the number of repetitions.

safety: >-
  This is the one technique in the topic that is a denial-of-service primitive
  at low request rates: each request holds a backend connection for the injected
  interval, and a pooled backend exhausts its pool long before a tester notices.
  Keep the interval short, keep concurrency at one, never place a delay inside a
  loop or a per-row expression, and agree the technique with the client before
  the first request rather than after the first outage.

payloads: payloads/sqli/time.yaml
tools: [curl, burp-repeater]
card: cards/sqli/inference.md
mitigation: mitigations/parameterised-query.md
dimensions:
  engine: [mysql, postgresql, mssql, oracle, sqlite]
