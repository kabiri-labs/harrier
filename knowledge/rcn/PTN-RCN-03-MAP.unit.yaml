id: PTN-RCN-03-MAP
topic: PTN-RCN-03
status: sketched
role: stage
kind: recon
title: "The requests the application issues and what each carries"
objective: >-
  Record every request the application itself issues and the parameters each
  carries, since this inventory is the input every injection and access-
  control test reads.

requires:
  all_of: [recon.target.reachable]
motivated_by: [recon.traffic.captured]
yields: [recon.entrypoints.mapped]

hypotheses:
  - "The client sends parameters the interface never shows, because the interface is one caller of the API and not its specification."
  - "Values travel in more places than the query and the body: headers the framework binds, path segments, cookie fields, parts of an upload."
  - "The application's own bundles, source maps and schema documents name endpoints the interface never navigates to."
  - "The same backend serves more than one client, and each client reaches a different part of it."

triage:
  - "Endpoints named in client-side code that no interaction reaches."
  - "A schema or specification document the API publishes about itself: openapi.json, swagger-ui, a graphql endpoint, a wp-json route."
  - "Responses whose fields have no matching request parameter, which usually means the write path accepts more than the read path shows."
  - "Requests that answer without a session, since who can reach an entry point decides which tests apply to it."

sequence:
  - "Drive the application through its own interface with a proxy recording, covering each role the engagement grants."
  - "Read the client's own code for requests the interface does not exercise: bundles, source maps, service workers and the schema documents an API publishes about itself."
  - "Record every request as method, path, and each parameter with the place it travels -- path, query, body field, header, cookie, uploaded part."
  - "Note which entry points answer without a session, since that is what decides who can reach each one."

first_false_positive: >-
  A parameter that appears in a captured request but is written by the client
  from a value the server issued moments earlier. It is an entry point only if
  the server accepts a value the client did not compute, so the inventory
  records where each value comes from, not only that it was sent.

done_when: >-
  Every request the interface issues under each granted role is recorded with
  its parameters and their positions, and each entry point read out of client
  code is either confirmed by a request or recorded as unexercised.
