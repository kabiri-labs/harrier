id: PTN-RCN-08
title: "Public exposure and metafile discovery"
domain: RCN
axis: phase
kind: recon

surfaces:
  always: true

order:
  - PTN-RCN-08-MAP
  - PTN-RCN-08-PROBE

boundaries:
  - subject: "Content that should never have been public"
    home: PTN-ERR-04
    note: >-
      Building a map from what is already indexed is recon. A credential or an
      internal hostname found while doing it is a disclosure finding, and the
      two are recorded separately because only one of them is a result.
  - subject: "A metafile that discloses internals rather than paths"
    home: PTN-ERR-03
    note: >-
      robots.txt and sitemap.xml enumerate paths, which is a map. The same file
      naming a staging host or an unreleased feature is leakage.

see_also: [PTN-ERR-03, PTN-ERR-04, PTN-RCN-02]

refs:
  wstg: [WSTG-INFO-01, WSTG-INFO-03]
