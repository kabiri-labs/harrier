id: PTN-RCN-04-MAP
topic: PTN-RCN-04
status: sketched
role: stage
kind: recon
title: "The tiers a request passes through"
objective: >-
  Record the sequence of intermediaries a request crosses and where it is
  finally answered, since a control observed at one tier says nothing about
  the next.

requires:
  all_of: [recon.target.reachable]
yields: [recon.tiers.mapped]

hypotheses:
  - "More than one component answers, and each was configured by different people at different times."
  - "A control observed at one tier says nothing about the next, which is why the count of tiers matters before any of them is tested."
  - "The tier that answers an ordinary request is often not the tier that answers an unusual one."

triage:
  - "Headers an intermediary adds about itself, and the order they arrive in."
  - "Headers naming a cache decision, an age, or a hop count."
  - "A response to an unmapped path or an unsupported method, which is usually authored by a different layer from the one serving the application."
  - "A difference between the answer from outside and the answer from any second position the engagement grants."

sequence:
  - "Request a resource and read what the response says about the hops it crossed: the headers an intermediary adds about itself, the ones naming a cache decision, and the ordering they arrive in."
  - "Send a request the origin would answer differently from anything in front of it -- an unmapped path, a malformed version, a method the application does not use -- and record which layer answered."
  - "Repeat from a second position on the network where the engagement grants one, since a tier that is invisible from outside is often visible from beside it."

first_false_positive: >-
  A single intermediary that adds several headers of its own and reads as
  several tiers. Counting hops by header count overstates the chain, so a tier
  is recorded when something answers differently, not when something adds a
  name.

done_when: >-
  The sequence of tiers a request crosses is written down in order, each one
  named by the response that revealed it, and the layer that finally answers is
  identified.
