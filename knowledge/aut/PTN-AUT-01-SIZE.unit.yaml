id: PTN-AUT-01-SIZE
topic: PTN-AUT-01
status: outline
role: stage
title: "Handling of an over-long credential"
objective: >-
  Determine whether a credential longer than the accepted maximum is rejected
  or silently truncated, since truncation shortens the secret without telling
  anyone.

requires:
  all_of: [recon.entrypoints.mapped]
  any_of: [access.anon, access.user]
yields: [control.credential.weak]
