id: PTN-AUT-04
title: "Authentication bypass"
domain: AUT
axis: technique

surfaces:
  any_of: [login-form, sso-oidc, token-bearing, admin-panel]

order:
  - PTN-AUT-04-MAP
  - PTN-AUT-04-DIFF
  - PTN-AUT-04-REPLAY

boundaries:
  - subject: "Reaching a function without authenticating at all"
    home: PTN-ACL-03
    note: >-
      Defeating the authentication mechanism is here; an unauthenticated
      request that a missing check lets through is access control.

  - subject: "Reuse of an identifier issued after authentication succeeded"
    home: PTN-SES-09
    note: >-
      Replaying an artefact of the authentication exchange defeats the
      mechanism. Replaying the identifier it issued rides a session that was
      established legitimately.

see_also: [PTN-ACL-03]

refs:
  wstg: [WSTG-ATHN-04]
  cwe: [287]
