id: PTN-RES-01-EVADE
topic: PTN-RES-01
status: authored
role: stage
kind: recon
title: "Normalisation and encoding evasion"
objective: >-
  Determine whether a negative result is caused by path normalisation or an
  allow-list rather than by the parameter never naming a path.

requires:
  all_of: [recon.entrypoints.mapped]
motivated_by: [recon.platform.identified, recon.intermediary.identified]
yields: [control.pathfilter.identified]

hypotheses:
  - "A filter that blocks the plain sequence often misses the encoded one, because it was written against the shape rather than the meaning."
  - "One decode pass beats a double encoding, and the number of passes is a property of the stack rather than of the filter."
  - "The filter and the resolver are different components, and a form that survives the first may still be understood by the second."

triage:
  - "Which layer refused: the filter's own response shape, or the application's."
  - "Encoding depth, mixed separators, and sequences that reconstruct after a single collapse."
  - "Whether a negative result came from agreement between the components or from a filter rejecting the form on sight."

enter_when:
  - "The probe came back negative and the parameter still looks like a path."
  - "A response was refused rather than not-found, which is a filter speaking."

sequence:
  - "Send the plain sequence as the control, and read everything else as a difference from it."
  - "Send the singly encoded form: succeeding here puts the filter before the decoder."
  - "Send the doubly encoded form: succeeding here puts a second decode after the filter, which is usually a proxy in front of an application."
  - "Send the stripped-sequence doubling: succeeding here means the filter replaces rather than rejects, and does not re-examine what it produced."
  - "Record which forms the filter survived, not merely whether one did."

first_false_positive: >-
  Reading a blocked request as a filtered one. A request refused before it
  reached the application says nothing about the application's own normalisation,
  and an intermediary's block page is the tell -- which is why identifying the
  tiers motivates this unit.

false_positives:
  - "A rate limiter answering the later payloads in a sweep, which makes a working form look rejected because of when it was sent."

preconditions:
  - "The parameter is reached by the sweep. A signature-matching filter may drop the connection instead of answering, and that too is a result to record."

evidence:
  - "The full table of forms tried and the response to each, including the control."

done_when: >-
  Each encoding form is recorded as passed, stripped, rejected, or blocked
  upstream -- and the layer that answered is named for each.

safety: >-
  Encoding sweeps are what filtering products are built to notice. On a
  monitored target this unit is what raises the alert, so agree the volume
  beforehand and keep the sweep to the entries that distinguish something.

payloads: payloads/traversal/encoding.yaml
tools: [burp-repeater, burp-intruder]
card: cards/traversal/path-resolution.md
dimensions:
  os: [unix, windows]
  platform: [php, java, dotnet, python, nodejs]
