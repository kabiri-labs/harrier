id: HRR-RES-01-READ
topic: HRR-RES-01
status: authored
title: "Confirmed read outside the intended root"
objective: >-
  Determine whether the content of a file the application never intended to serve
  is returned in the response body.

requires:
  all_of: [surface.path.traversable]
motivated_by: [recon.approot.disclosed, control.pathfilter.identified]
yields: [primitive.fs.read]

enter_when:
  - "The probe established that the parameter resolves a path."

oracle:
  positive: "The response body carries a fingerprint of a system file that no error page produces -- root:x:0:0, or the literal ; for 16-bit app support."
  negative: "Every target, at every depth the clamp allows, in every form the filter survived, returns no file content."
  inconclusive: "The response is a document the browser downloads rather than renders, and its content was not read."

sequence:
  - "Pick the target by the operating system already identified, not by habit."
  - "Overshoot the depth rather than resolving it: resolvers clamp at the root and the clamp does the arithmetic."
  - "Match on the file's fingerprint, never on status or length."
  - "Read one file. Record the marker. Stop."

first_false_positive: >-
  A friendly error page containing the requested filename. The body is what is
  being read, and a 200 with a page in it is not a file -- which is why every
  target in the payload file is chosen for a marker no error page imitates.

false_positives:
  - "A file the application does serve deliberately, reached by a path that merely looks like traversal."
  - "A cached copy of a body from an earlier, different request in the same sweep."

preconditions:
  - "The operating system is known, or the first two targets are wasted requests."

evidence:
  - "The request, and the response excerpt containing the fingerprint -- not the file."

done_when: >-
  One file outside the intended root is read and its marker recorded, or every
  target is recorded as refused with the depth and encoding that were tried.

safety: >-
  Read one system file, chosen because it holds no personal data, and stop.
  Application configuration is where the credentials are: reading it takes the
  client's secrets onto the tester's disk, and that is a decision to put to the
  client rather than a step in a procedure. Nothing here reads user data to
  prove a point that a system file already proves.

payloads: payloads/traversal/targets.yaml
tools: [burp-repeater, curl]
card: cards/traversal/path-resolution.md
mitigation: mitigations/path-resolution.md
dimensions:
  os: [unix, windows]
  platform: [php, java, dotnet, python, nodejs]
