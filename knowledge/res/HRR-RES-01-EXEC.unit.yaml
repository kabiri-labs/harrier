id: HRR-RES-01-EXEC
topic: HRR-RES-01
status: authored
title: "Inclusion and execution of the resolved path"
objective: >-
  Determine whether the resolved path is included or executed rather than only
  read, which a deployment can permit or forbid independently.

requires:
  all_of: [primitive.fs.read]
motivated_by: [recon.platform.identified]
yields: [primitive.exec.server]

enter_when:
  - "A read has been confirmed and the sink might interpret rather than return."

oracle:
  positive: "A source file of the application, requested through the parameter, comes back as rendered output or as nothing -- its text was interpreted rather than returned."
  negative: "That same source file comes back as source, with its opening tag or its imports visible, which is a sink that reads."
  inconclusive: "No file of the application's own source could be named, so the only files available are ones both sink kinds return identically."

sequence:
  - "Name a source file of the application itself, from the paths it serves or from the disclosed application root."
  - "Request it through the parameter. Source text returned means the sink reads; record that and stop."
  - "Rendered output or an empty body means the sink interpreted it. Confirm by requesting the same file through a source-reading wrapper, which returns the source the plain request would not give."
  - "Record the pair. A system file proves nothing here: a sink that includes emits a file containing no code exactly as a sink that reads does."

first_false_positive: >-
  A system file returned intact, read as proof that the sink only reads. It is
  not: an interpreter emits a file with no code in it unchanged, so /etc/passwd
  coming back whole says nothing at all about interpretation. Only a file whose
  interpretation differs from its text can answer this, which on every platform
  here means the application's own source.

false_positives:
  - "An empty body because the path was wrong, not because the sink interpreted what it found. The wrapper confirmation is what separates those."
  - "A source-reading wrapper returning encoded source, read as evidence of inclusion. A read sink returns the same bytes through the same wrapper."

preconditions:
  - "A file of the application's own source can be named. Without one there is no file whose interpretation differs from its text, and the question cannot be answered from outside."
  - "The platform is identified: the wrapper that confirms a positive is platform-specific, and there is no generic substitute."

evidence:
  - "The response to the application source file, and where the sink interpreted, the wrapper response returning the same file as source."

done_when: >-
  The sink is recorded as reading or as interpreting, with the pair of responses
  that decided it.

safety: >-
  Stop at the wrapper read, which takes nothing and changes nothing. Writing
  content into a file the server will later interpret -- poisoning a log to turn
  a read into execution -- alters the target in a way that cannot be undone from
  outside and can break it. It needs written agreement naming that step, and it
  is where an engagement stops and talks to the client rather than continuing.

payloads: payloads/traversal/inclusion.yaml
tools: [burp-repeater]
card: cards/traversal/path-resolution.md
mitigation: mitigations/path-resolution.md
dimensions:
  platform: [php, java, dotnet, python, nodejs]
