id: HRR-RES-01-EXEC
topic: HRR-RES-01
status: authored
title: "Inclusion and execution of the resolved path"
objective: >-
  Determine whether the resolved path is included or executed rather than only
  read, which a deployment can permit or forbid independently.

requires:
  all_of: [primitive.fs.read]
motivated_by: [recon.platform.identified]
yields: [primitive.exec.server]
closes: [primitive.exec.server]

enter_when:
  - "A read has been confirmed and the sink might interpret rather than return."

oracle:
  positive: "The response carries the result of interpreting a file rather than its bytes -- source returned encoded through a wrapper while the plain path returned nothing, or output where the file's own text was expected."
  negative: "Every file returns verbatim, including one whose interpretation would visibly differ from its text."
  inconclusive: "The sink returns nothing for both forms, so reading and interpreting cannot be told apart from outside."

sequence:
  - "Ask for a file whose text and whose interpretation differ visibly -- a system file an interpreter would mangle."
  - "If it returns verbatim, the sink reads; record that and stop."
  - "If it returns empty or mangled, ask for the same file through a source-reading wrapper."
  - "Compare the two answers. That comparison, not either response alone, is the result."

first_false_positive: >-
  An empty response read as execution. A file can be empty, unreadable, or
  refused by permissions, and all three look like an interpreter swallowing it.
  The wrapper comparison is what separates them, which is why it is a step rather
  than an alternative.

false_positives:
  - "Output buffering returning nothing for a file that was in fact only read."
  - "A response that is empty because the depth was wrong, not because the sink interpreted."

preconditions:
  - "The platform is identified: the wrapper that makes this comparison possible is platform-specific, and there is no generic substitute."

evidence:
  - "The verbatim-versus-interpreted pair of responses for the same path."

done_when: >-
  The sink is recorded as reading or as interpreting, with the pair of responses
  that decided it.

safety: >-
  Stop at the wrapper read, which takes nothing and changes nothing. Writing
  content into a file the server will later interpret -- poisoning a log to turn
  a read into execution -- alters the target in a way that cannot be undone from
  outside and can break it. It needs written agreement naming that step, and it
  is where an engagement stops and talks to the client rather than continuing.

payloads: payloads/traversal/inclusion.yaml
tools: [burp-repeater]
card: cards/traversal/path-resolution.md
mitigation: mitigations/path-resolution.md
dimensions:
  platform: [php, java, dotnet, python, nodejs]
