id: PTN-PRT-04-READ
topic: PTN-PRT-04
status: sketched
role: stage
title: "Resource exposed by the divergence"
objective: >-
  Determine whether the divergence returns a resource that the intermediary's
  own rules were meant to keep unreachable.

requires:
  all_of: [surface.path.divergence]
yields: [primitive.check.bypassed]

hypotheses:
  - "The intermediary's rules are the only thing keeping the resource unreachable, and the origin will serve it to anyone who asks it directly."
  - "A single-page application answers any unmatched path with its own shell, which returns successfully and proves nothing."
  - "What the rules protect is visible from the refusals already observed, so the target list does not need guessing."

triage:
  - "Paths the intermediary was already observed to refuse."
  - "A marker that only the restricted resource itself carries."
  - "The difference between the allowed baseline body and the crafted response, rather than the status."

sink: >-
  The origin's own resource handler, reached with a path the layer in front
  matched as something else entirely.

oracle:
  positive: "The divergent form returns a resource the intermediary's own rules were meant to keep unreachable, with the content that resource holds rather than an error page."
  negative: "Every resource the intermediary restricts was requested through the divergent form and each remains refused or empty."

sequence:
  - "List what the intermediary's rules are there to keep unreachable, from the refusals already observed rather than from guesswork."
  - "Request each through the divergent form and compare the body against both the allowed and the refused baseline."
  - "Confirm the content is the restricted resource itself -- a marker only it carries -- rather than a page that merely returned successfully."
  - "Read one such resource, record the marker, and stop."

first_false_positive: >-
  A successful answer carrying the application's own single-page shell. Any
  unmatched path returns it, so a read counts only on a marker the restricted
  resource itself carries.

done_when: >-
  Every restricted resource has been requested through the divergent form, and
  each is recorded as returned with the marker that identifies it or as still
  refused.
