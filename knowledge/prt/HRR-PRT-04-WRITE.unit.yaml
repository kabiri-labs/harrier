id: HRR-PRT-04-WRITE
topic: HRR-PRT-04
status: sketched
role: stage
title: "Cache entry created under a divergent key"
objective: >-
  Determine whether the divergence stores a response under a key that a later,
  ordinary request will match.

requires:
  all_of: [surface.path.divergence]
yields: [primitive.content.poisoned]

oracle:
  positive: "A response stored under the divergent form is returned to a later ordinary request for the resource it shadows."
  negative: "Every divergent form was stored under its own key, and an ordinary request for the shadowed resource returns the response it always returned."

sequence:
  - "Choose a resource the tester controls or one that is inconsequential to the client, never an entry page or anything an ordinary user will request."
  - "Establish what the cache stores it under, from the cache's own indicators on a repeated ordinary request."
  - "Establish how an entry here would be cleared before creating one: a purge the engagement grants, or a lifetime short enough to expire inside the window. Where neither is available, stop here and report the divergence -- an entry nobody can clear is one the client is left with."
  - "Send the divergent form once with a marker of the tester's own, then make an ordinary request from a fresh client and look for the marker."
  - "Clear the entry, and confirm an ordinary request returns what it returned before."

first_false_positive: >-
  The marker returned to the tester's own repeat request from a local or
  per-connection cache rather than the shared one. Nothing was stored for anyone
  else, so the confirming request is made from a fresh client, and ideally from
  a second position.

done_when: >-
  Either a divergent form has been sent against a resource chosen for the
  purpose, a subsequent ordinary request recorded as carrying the marker or not,
  and the entry cleared with the original response confirmed back; or the test is
  recorded as not run because no way to clear an entry was available.
