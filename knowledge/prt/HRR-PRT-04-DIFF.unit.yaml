id: HRR-PRT-04-DIFF
topic: HRR-PRT-04
status: sketched
role: variant
title: "Divergent path resolution"
objective: >-
  Determine whether a crafted path is matched against one rule set by the
  intermediary and a different one by the origin.

requires:
  all_of: [recon.tiers.mapped]
yields: [surface.path.divergence]

hypotheses:
  - "The intermediary matches a rule against the path as written, and the origin resolves it after collapsing it."
  - "Only one of the two decodes a given form, which is what makes the same bytes two different paths."
  - "A path parameter is stripped by one layer and kept by the other, because one implements a specification the other ignores."

triage:
  - "A path the intermediary allows and one it refuses, both confirmed, as the pair every candidate is judged against."
  - "Dot segments placed so that collapsing them happens after matching."
  - "Separators encoded once and twice, and separators of the other operating system."
  - "Path parameters, which one layer treats as part of the name and the other does not."

sink: >-
  Two path matchers in sequence -- the intermediary's rule set and the origin's
  router -- neither of which sees the other's reading of the same request.

oracle:
  positive: "One path is matched against the intermediary's rules as one thing and resolved by the origin as another: a request the intermediary treats as an allowed resource reaches a different resource behind it."
  negative: "Every crafted form was matched and resolved as the same path by both layers, or refused by both."

sequence:
  - "Establish a baseline pair: a path the intermediary allows, and one it refuses, both confirmed as refused or allowed for the same reason."
  - "Craft forms that the two layers may read differently -- a dot segment the origin collapses after matching, an encoded separator only one of them decodes, a path parameter one of them strips, a separator only one of them treats as one."
  - "Send each and compare against both baselines: the finding is an allowed answer for a form that should have been refused."
  - "Confirm each candidate against the origin directly, so the divergence is attributed to the pair rather than to either layer alone."

first_false_positive: >-
  A redirect to the same place for both the baseline and the crafted form. The
  status differs and the destination does not, so nothing was bypassed --
  candidates are judged on where the request finally lands, not on the first
  response.

done_when: >-
  Every crafted form has been sent against both baselines and confirmed against
  the origin, with each recorded as resolving identically at both layers or as
  diverging, naming the two readings.
