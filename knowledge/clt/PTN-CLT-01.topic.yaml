id: PTN-CLT-01
title: "Cross-site scripting via server-returned output"
domain: CLT
axis: context

surfaces:
  any_of: [search, rich-text, stored-then-rendered, redirect-param, template-param]

boundaries:
  - subject: "Output the browser itself wrote"
    home: PTN-CLT-02
    note: >-
      This topic is output the server produced. When client script writes it
      into a sink, nothing the server returned was ever unsafe.
  - subject: "Reflected versus stored delivery"
    home: null
    note: >-
      Not a separate topic. Delivery is a dimension: it changes where the
      payload is pasted, not what proves it fired.

see_also: [PTN-CFG-05, PTN-CLT-02, PTN-CLT-03, PTN-CLT-04, PTN-INJ-10]

order:
  - PTN-CLT-01-PROBE
  - PTN-CLT-01-HTMLBODY
  - PTN-CLT-01-HTMLATTR
  - PTN-CLT-01-HTMLURI
  - PTN-CLT-01-JSSTR
  - PTN-CLT-01-JSCODE
  - PTN-CLT-01-CSS
  - PTN-CLT-01-SVG
  - PTN-CLT-01-MARKUP
  - PTN-CLT-01-EVADE

refs:
  wstg: [WSTG-INPV-01, WSTG-INPV-02, WSTG-CLNT-03]
  cwe: [79, 80]
