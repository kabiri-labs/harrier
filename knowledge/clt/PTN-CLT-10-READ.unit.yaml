id: PTN-CLT-10-READ
topic: PTN-CLT-10
status: outline
role: stage
title: "Retrieval of the stored personal response"
objective: >-
  Determine whether the response the directives allowed to be stored is
  returned to somebody it was not issued to -- from the shared cache that kept
  it, or from the browser store on a device the next person also uses, since
  the directives permit either and only retrieval says which one cost anything.
requires:
  all_of: [control.cache.permissive]
yields: [primitive.stored.read]
