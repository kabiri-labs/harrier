id: HRR-CLT-01-JSSTR
topic: HRR-CLT-01
status: authored
role: stage
title: "Script string literal context"
objective: >-
  Determine whether a value written inside a JavaScript string literal can end
  the literal and have the remainder parsed as code.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The value was encoded for HTML and written into script, so the entities are inert characters and the quote is untouched."
  - "The template escapes the quote by prefixing a backslash, which a backslash of the tester's own restores."
  - "The parser ends the script element on the literal text of a closing tag regardless of the JavaScript around it, so the element can be left even where the literal cannot."

triage:
  - "A marker inside a script block, a JSON blob or a configuration object the page defines inline."
  - "A page that renders a submitted value into a template literal or a variable assignment for later use."
  - "A search term or username echoed into analytics or logging code at the foot of the page."

sink: >-
  The script block the page already executes, where the value sits inside a
  literal whose delimiter the tester may be able to write.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "An expression the tester wrote is evaluated by the page's own script block, producing a marker no string could have produced."
  negative: "Every quote form arrives backslash-escaped or unicode-escaped in the raw body, so the literal cannot be ended."
  inconclusive: "The script block fails to parse for a reason unrelated to the payload, so nothing in it ran including the application's own code."

sequence:
  - "Read from the raw body which quote opens the literal, and whether the block is inline or inside a JSON value the page later parses."
  - "Send the matching quote alone and read the body: an escaped quote is a negative, an unescaped one has ended the literal."
  - "Complete the statement so the block still parses -- an unbalanced payload breaks the page and executes nothing, which reads as a negative."
  - "Prove evaluation with a computed marker rather than a literal one."

first_false_positive: >-
  HTML encoding read as safety. Inside a script block the angle brackets are
  ordinary characters and the quote is the only delimiter that matters, so a
  value that is correctly HTML-encoded can still be fully live here -- this is
  the context most often recorded clean because the wrong encoder was checked.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  The literal's delimiter is recorded, and the value is recorded as ending the
  literal, escaped, or leaving the script element -- with the computed marker
  where evaluation followed.

safety: >-
  A payload that breaks the page's own script block breaks the page for whoever
  loads it, which is a change to the application rather than an observation of
  it: keep every payload balanced. Where the delivery is stored, the marker
  fires in real users' browsers, so it is silent, it sits in a record the
  engagement created, and its location is recorded -- and the page is confirmed
  still working after it is placed.

payloads: payloads/xss/jsstr.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
