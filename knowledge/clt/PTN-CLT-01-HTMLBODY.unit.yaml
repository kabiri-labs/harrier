id: PTN-CLT-01-HTMLBODY
topic: PTN-CLT-01
status: authored
role: stage
title: "Element content context"
objective: >-
  Determine whether a value returned inside element content can introduce a new
  element whose script the browser executes.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The template writes the value without HTML-encoding it, so a tag delimiter opens an element rather than printing a character."
  - "The encoder runs but covers only the quote characters an attribute needs, leaving the angle brackets element content needs."
  - "The value lands inside an element whose content model is not parsed as markup -- a textarea, a title, a comment -- so escaping that element is the first step and not the payload."

triage:
  - "A marker returned between two tags rather than inside one, with an unencoded angle bracket beside it."
  - "Search result headings, error banners and breadcrumb trails, which render a submitted value as prose."
  - "A value inside textarea, title, noscript or an HTML comment, where the escape sequence differs from the payload."

sink: >-
  The markup the browser parses, where a value written into element content
  becomes an element rather than text.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "A payload the tester introduced runs script in the page's own origin, observed as the marker the payload was written to produce."
  negative: "Every element and event-handler form in the payload file arrives HTML-encoded in the raw body, so no new element is ever parsed."
  inconclusive: "The markup is present and unencoded in the body, and a content policy or a built-in browser filter suppressed execution -- an injection with a control in front of it, which the evasion unit continues."

sequence:
  - "Confirm from the probe that at least one angle bracket survives into this occurrence."
  - "Introduce an element that carries its own load event rather than one that needs a script block, since a policy commonly blocks the second and not the first."
  - "Read the raw body to confirm the element was written, then the running page to confirm it executed -- the two answers are different findings."
  - "Where the value sits in a non-markup content model, close that element first and record the escape as part of the result."

first_false_positive: >-
  Markup that appears in the page without executing. The element was introduced,
  which is a real and separate finding belonging to the markup unit, and it is
  not script execution -- the marker has to come from script the browser ran,
  not from a node the browser built.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  The element is recorded as parsed and executing, parsed without executing, or
  encoded -- with the raw body excerpt and the running-page observation that
  decided which, taken separately.

safety: >-
  Where the delivery is stored, the payload fires in real users' browsers and
  not in the tester's. Use a silent marker rather than a dialog, keep it in a
  record the engagement created, and remove it or hand the client its exact
  location before the engagement closes. A dialog left in a shared page is an
  incident of the tester's own making.

payloads: payloads/xss/htmlbody.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
