id: PTN-CLT-01-CSS
topic: PTN-CLT-01
status: authored
role: stage
title: "Style context"
objective: >-
  Determine whether a value written into a style attribute or a stylesheet block
  can leave the style context and reach markup the browser executes.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The value is written into a style attribute whose quote the template did not encode, so the attribute and then the tag can both be closed."
  - "The parser ends a stylesheet element on the literal closing tag whatever the CSS around it says."
  - "The boundary holds and the value still controls a declaration, which is a different finding belonging to another topic."

triage:
  - "A colour, width, position or theme parameter rendered into a style attribute."
  - "A page that builds an inline stylesheet from a submitted preference."
  - "A marker returned inside a style attribute rather than inside element content."

sink: >-
  The style attribute or stylesheet block the browser parses, and the markup
  boundary that ends it.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "Script runs in the page's origin from markup introduced by escaping the style context."
  negative: "The delimiters that end a declaration, an attribute and a stylesheet block are all encoded, so the value stays a style value."
  inconclusive: "The style context ends but the introduced markup is suppressed by a policy, which the evasion unit continues."

sequence:
  - "Read whether the value is inside a style attribute or inside a stylesheet block; the escape differs."
  - "Send the delimiter that ends the context and confirm from the raw body that it survived."
  - "Introduce markup after the boundary and confirm execution in the running page."
  - "Where the boundary holds, record what the value can still do inside style alone, and stop -- that is a separate finding and not this unit's."

first_false_positive: >-
  A visual change read as a finding of this unit. Controlling a style value is
  real and belongs to the CSS injection topic; this unit is satisfied only by
  script running, and the two are different results with different severity.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  The style context is recorded as ended or held, and where it ended, execution
  is recorded as following or suppressed -- with any style-only control recorded
  separately and handed to its own topic.

safety: >-
  Nothing here hides, moves or overlays a page control: a stored style payload
  that changes what other users can operate is a change to the application
  rather than an observation of it. Where the delivery is stored, the marker is
  silent, it sits in a record the engagement created, and its location is
  recorded for removal before the engagement closes.

payloads: payloads/xss/css.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
