id: HRR-CLT-01-HTMLURI
topic: HRR-CLT-01
status: authored
role: stage
title: "URL-bearing attribute context"
objective: >-
  Determine whether a value that becomes the URL of a link, an image, a form
  action or a frame can name a scheme the browser executes rather than fetches.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The application validates the URL's shape rather than its scheme, so a well-formed value naming an executable scheme passes."
  - "A rewriter matches the scheme as a literal string, and the browser strips control characters from a URL before parsing it."
  - "A prefix the application prepends is displaced by an absolute or protocol-relative form, so the destination is the caller's after all."

triage:
  - "Parameters that become a destination: redirect, next, url, return, continue, callback, image, src."
  - "A value rendered into href, src, action or formaction rather than into text."
  - "A link the page builds from a submitted value and presents as its own navigation."

sink: >-
  The URL the browser resolves for an href, src, action or formaction attribute,
  where the scheme rather than the path decides what happens.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "Navigating or submitting through the attribute runs script in the page's origin, from a scheme the tester supplied."
  negative: "Every scheme form is rejected, rewritten or prefixed by the application, so the resolved URL is always one the application chose the scheme for."
  inconclusive: "The attribute is on an element the tester cannot cause to be activated, so the scheme was never resolved."

sequence:
  - "Read which attribute the value lands in; a script-bearing scheme executes in some of them and merely fails to load in others."
  - "Send a scheme the browser treats as executable, in the plain form, and confirm from the body that it survived unrewritten."
  - "Where a prefix is prepended, test whether a protocol-relative or absolute form displaces it."
  - "Activate the element in the way an ordinary user would, and record whether execution followed."

first_false_positive: >-
  An open redirect read as script execution. The destination changed, which is a
  finding belonging to another topic, and nothing ran in this page's origin --
  the marker must be produced by script, not by arriving somewhere.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  Each scheme form is recorded as surviving unrewritten, rewritten, or refused,
  and where one survived, the element was activated and execution recorded as
  followed or not.

safety: >-
  Do not point the attribute at a live third-party site. The destination is a
  location the tester controls or a scheme that executes locally, so no request
  carrying the target's referrer and session context leaves for somebody else's
  server. Where the delivery is stored, the destination is reached by whoever
  loads the page, so its location is recorded for removal.

payloads: payloads/xss/htmluri.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
