id: HRR-CLT-01-MARKUP
topic: HRR-CLT-01
status: authored
role: stage
title: "Markup injection without script execution"
objective: >-
  Determine whether markup the tester introduces is parsed into the document in
  a deployment where script execution is prevented.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.markup.inject]

hypotheses:
  - "The application encodes nothing and a browser policy is the only thing stopping execution, so everything that needs no script is still available."
  - "The policy names script sources and says nothing about form destinations or the document's base URL."
  - "An element the tester introduces makes a request on its own, with no script involved at any point."

triage:
  - "A payload sitting intact in the raw body while nothing runs, which is a policy rather than an encoder."
  - "A content policy header with no form-action or base-uri directive."
  - "Any page that submits somewhere, where an introduced form would be read as the page's own."

sink: >-
  The document tree the browser builds, where an element the tester introduced
  is present and does not execute.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "An element the tester introduced is present in the parsed document and affects what the page shows, submits or requests, while no script of the tester's runs."
  negative: "The markup arrives encoded, so nothing the tester wrote becomes an element."
  inconclusive: "The element is present but out of the visible flow and drives nothing, so what it permits could not be established."

sequence:
  - "Confirm from the running document that the element was parsed rather than printed."
  - "Introduce a form or a control whose destination the tester chose, and confirm the page presents it as its own."
  - "Introduce an element that causes the browser to make a request, and read the request rather than the page."
  - "Record what the injected markup reaches -- a destination, a request, a rendered instruction -- rather than recording that markup was possible."

first_false_positive: >-
  Recording this unit as the consolation prize for a failed script payload. The
  finding is what the markup permits without script, and a unit that records
  only that a bracket survived has established nothing the probe did not.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  What the injected markup reaches is recorded -- a destination, a request the
  browser made, or a rendered instruction -- or the markup is recorded as
  encoded, with every element placed removed.

safety: >-
  Injected markup that changes what a page asks a user to do is capable of
  harming somebody who is not the tester, and it needs no script to do it. Every
  destination points at a location the tester controls, never a third party.
  Where the delivery is stored, the element is placed in a record the engagement
  created, its exact location is recorded, and it is removed as soon as the
  observation is made rather than at the end of the engagement.

payloads: payloads/xss/markup.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
