id: HRR-CLT-01-EVADE
topic: HRR-CLT-01
status: authored
role: stage
kind: recon
title: "Filter and encoding evasion"
objective: >-
  Determine whether a negative result from a context unit is caused by an
  encoder, a sanitiser, a content policy or an upstream filter, rather than by
  the absence of a reflection.

requires:
  all_of: [surface.reflection.unencoded]
yields: [control.filter.identified]

hypotheses:
  - "Four different mechanisms produce the same clean result -- the template's encoder, a sanitiser rewriting the markup, a content policy blocking execution, and an appliance refusing the request -- and each is defeated differently or not at all."
  - "A sanitiser that removes rather than rejects does not re-examine its own output."
  - "The policy blocks the source rather than the injection, so the markup is entirely present and the finding is in the body rather than in the console."

triage:
  - "A content policy header, and whether it names a nonce, a hash, unsafe-inline or a wildcard host."
  - "A response body carrying the payload intact while nothing executes, which is a policy rather than an encoder."
  - "A connection reset or a product's own block page, which is upstream of the application entirely."
  - "A payload accepted with one tag name and refused with another, which is a list rather than a parser."

enter_when:
  - "A context unit returned a negative result and the mechanism behind the refusal has not been attributed to a layer."

sequence:
  - "Separate the four mechanisms first: read the raw body for the payload, the response headers for a policy, and the status for an upstream refusal."
  - "Where an encoder is responsible, record which characters it covers and which it does not, since the answer often differs by context on one page."
  - "Where a sanitiser is responsible, send a form that becomes valid only after removal has run on it."
  - "Where a policy is responsible, record what it permits rather than trying to defeat it: a permitted host, a missing directive, or an inline allowance is the finding."

first_false_positive: >-
  A policy recorded as an encoder. The payload sitting intact in the body means
  the application encoded nothing, and the finding is an injection with a
  browser control in front of it -- a materially different result from a page
  that encoded its output correctly.

preconditions:
  - "A negative result from at least one context unit of this topic, which is what this unit explains."

evidence:
  - "The raw body showing whether the payload survived, and the response headers showing what the browser was told."
  - "The surviving form, where one was found, recorded so the context unit can be re-run with it."

done_when: >-
  The refusal is attributed to an encoder, a sanitiser, a browser policy or an
  upstream filter, and either a surviving form is recorded or each mechanism is
  recorded with what it covered.

payloads: payloads/xss/evasion.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/evasion.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
