id: PTN-CLT-01-SVG
topic: PTN-CLT-01
status: authored
role: stage
title: "Inline SVG context"
objective: >-
  Determine whether a value returned inside inline SVG markup can introduce an
  element the browser executes under SVG parsing rules.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The subtree parses under SVG's content model and namespace, so elements and events the HTML sanitiser never considered are available."
  - "A sanitiser whose element list was written for HTML leaves the SVG equivalents untouched."
  - "Foreign content reintroduces HTML parsing inside the subtree, which survives a list written for SVG only."

triage:
  - "A marker returned inside an inline svg element rather than inside an img referencing one."
  - "Charts, avatars, badges and icons the application generates from a submitted value."
  - "An uploaded image rendered inline rather than served as a file."

sink: >-
  The inline SVG subtree the browser parses, whose content model and namespace
  differ from the surrounding HTML.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "Script runs from an element or an event introduced inside the SVG subtree."
  negative: "The angle brackets are encoded inside the subtree, so nothing new is parsed."
  inconclusive: "The SVG is rendered from an external file or a data URL rather than inline, so the value never entered the document's own subtree."

sequence:
  - "Confirm from the raw body that the marker is inside an inline svg element rather than in an image referencing one."
  - "Introduce an element that carries script under SVG rules rather than an HTML element, since the content model differs."
  - "Read the running document to confirm the element entered the tree and executed."
  - "Where an HTML sanitiser processed the subtree, record which elements survived it and hand the rest to the evasion unit."

first_false_positive: >-
  An HTML payload that would have worked in element content, failing here and
  being recorded as a negative. The subtree parses under different rules, so a
  refusal of an HTML form says nothing about the SVG forms.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  Each SVG form is recorded as parsed and executed, parsed without executing, or
  encoded, and where a sanitiser processed the subtree the surviving elements are
  listed.

safety: >-
  Where the delivery is stored, the payload fires in real users' browsers rather
  than the tester's: use the silent marker, place it in a record the engagement
  created, and record its exact location for removal before the engagement
  closes.

payloads: payloads/xss/svg.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
