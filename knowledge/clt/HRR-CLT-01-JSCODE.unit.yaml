id: HRR-CLT-01-JSCODE
topic: HRR-CLT-01
status: authored
role: stage
title: "Executable script context"
objective: >-
  Determine whether a value written directly into executable script, outside any
  literal, is evaluated as code.

requires:
  all_of: [surface.reflection.unencoded]
motivated_by: [control.headers.permissive]
yields: [primitive.exec.client]

hypotheses:
  - "The value is a number or a flag the template writes bare, so it reaches the block as an operand rather than as data."
  - "A serialiser stands between the parameter and the block on this page and not on another, so the same parameter is data here and code there."
  - "The block runs only in a page state the tester has not reached, so nothing was evaluated either way."

triage:
  - "A submitted number, index, flag or identifier rendered bare into a script block."
  - "A configuration object built server-side where one field is unquoted and its neighbours are strings."
  - "A callback or JSONP parameter written into the block as an identifier."

sink: >-
  The statement the page's own script block executes, into which the value was
  written as an operand rather than as data.

enter_when:
  - "The probe recorded this parameter reaching this context with at least one of the context's delimiters unencoded."

oracle:
  positive: "An expression the tester supplied is evaluated by the page's script, producing a computed marker."
  negative: "The value is serialised into a literal or a JSON structure before it reaches the block, so it is never an operand."
  inconclusive: "The block does not run at all in the page state that was tested, so nothing in it was evaluated either way."

sequence:
  - "Read from the raw body whether the value is an operand or a serialised value; only the first is this unit's."
  - "Send an expression that evaluates to the value the page expects, so ordinary behaviour is preserved while evaluation is proved."
  - "Confirm the computed marker rather than a reflected one."
  - "Where a serialiser stands in the way, record the serialiser and hand the parameter back to the string-literal unit."

first_false_positive: >-
  A framework template placeholder that renders the value into the script for
  display, which reads like an operand in the source and is a string by the time
  the block runs. The computed marker separates the two; a reflected one cannot.

false_positives:
  - "A payload that fires in the tester's own developer console rather than in the page, which proves the console evaluates script and nothing about the application."
  - "A browser's built-in filtering or a strict policy suppressing execution while the injection is entirely present in the markup -- a negative in one browser and a positive in another."

preconditions:
  - "The probe's marker was located in the response, and the context around it was read from the raw body rather than from the rendered page."
  - "For stored delivery, a record the engagement is permitted to create, and a way to reach the page that renders it."

evidence:
  - "The raw response excerpt showing the marker in context, before and after the payload."
  - "The rendered result: the console entry, the network request or the DOM node the payload produced."

done_when: >-
  The value is recorded as an operand or as serialised, and where it was an
  operand, the computed marker is recorded as produced or absent.

safety: >-
  Preserve the value the page expected, so the marker proves evaluation without
  changing what the page then does with it -- and keep the payload parsable,
  since an operand that does not parse takes the page's own block down with it.
  Where the delivery is stored, the marker is silent and its location is
  recorded for removal before the engagement closes.

payloads: payloads/xss/jscode.yaml
tools: [burp-repeater, browser-devtools]
card: cards/xss/contexts.md
mitigation: mitigations/output-encoding.md
dimensions:
  delivery: [reflected, stored]
  browser: [chromium, firefox, webkit]
