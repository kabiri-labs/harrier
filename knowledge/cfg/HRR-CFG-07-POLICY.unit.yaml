id: HRR-CFG-07-POLICY
topic: HRR-CFG-07
status: outline
title: "Ownership and mode of the deployed files"
objective: >-
  Determine, where the engagement grants access to the host, whether the
  ownership and mode of the application's files and directories give the
  serving process, or any other account on the host, more than it needs.

requires:
  all_of: [access.host]
yields: [control.permissions.excessive]
closes: [control.permissions.excessive]
