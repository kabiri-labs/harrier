id: HRR-CFG-08-PROBE
topic: HRR-CFG-08
status: authored
role: stage
title: "A delegation pointing at a resource that can be claimed"
objective: >-
  Determine whether any delegation resolves to a resource that no longer exists
  at the provider and that another account could register.

requires:
  all_of: [recon.delegation.mapped]
yields: [primitive.subdomain.claimable]
closes: [primitive.subdomain.claimable]

enter_when:
  - "The delegated names and the provider each points at have been recorded."

oracle:
  positive: "The provider answers for the delegated name with its own unclaimed-resource response, and its documentation states that the name is available to any account."
  negative: "Every delegated name resolves to a resource the provider reports as claimed."
  inconclusive: "The provider returns a generic error that does not distinguish an unclaimed resource from one belonging to somebody else."

sequence:
  - "Resolve each delegated name and record which provider answers."
  - "Request the name directly and compare the answer with that provider's documented unclaimed-resource response."
  - "Check the provider's own naming rules for whether the specific name is registrable."

first_false_positive: >-
  A provider error page that looks like an unclaimed resource but is served for
  any unrecognised host, including ones another customer holds. The provider's
  own documentation is the only reliable discriminator, not the page's wording.

false_positives:
  - "A name mid-migration, where the delegation is stale for minutes rather than abandoned."
  - "A provider that serves the same page for suspended accounts as for free names."

preconditions:
  - "The delegated name is in scope. A name pointing at a third party is that third party's asset even when the target still delegates to it."

evidence:
  - "The resolution chain for each name, and the provider response for each candidate."

done_when: >-
  Every delegated name is recorded as claimed, claimable, or indistinguishable
  with the provider evidence that decided it.

safety: >-
  Stop at establishing that the name is registrable. Registering it -- even to
  prove the point, even briefly -- takes a name the target still points at, and
  puts the tester in control of traffic meant for the client. If the client wants
  that proof, they ask for it in writing first.

tools: [dig, curl]
