id: PTN-CFG-02-IMPACT
topic: PTN-CFG-02
status: sketched
role: stage
title: "Whether the served file carries what it should not"
objective: >-
  Determine whether any such file carries content the operator would not have
  chosen to publish, which is what separates a stray asset from a disclosure.

requires:
  all_of: [surface.file.unlinked]
yields: [control.content.internal]

hypotheses:
  - "A copy of a file the application compiles or interprets carries the source rather than the output."
  - "Configuration is where credentials are, which is why a configuration copy is the one that matters."
  - "A value shaped like a credential may already be rotated, and the two are different findings."

triage:
  - "Files whose name shadows one the application serves as an executed page."
  - "Content carrying assignment shapes: a key and a value, a connection string, a private key header."
  - "Names that resolve inside a network the caller is not on."

oracle:
  positive: "A file the server returns carries content the operator would not have chosen to publish: source the application otherwise compiles away, a credential or key, an internal host name, or data belonging to the application's users."
  negative: "Every unlinked file found was read and each carries only content the application already publishes elsewhere."

sequence:
  - "Read each unlinked file for what it is rather than for what its name suggests: an archive is expanded, a version control directory is read for what it references, a backup is compared against the page it shadows."
  - "Record the shapes that decide it -- credentials, keys, internal host names, other accounts' data, source that is not otherwise published."
  - "Verify that anything credential-shaped is live rather than a rotated or sample value, without using it beyond that check."
  - "Take the smallest excerpt that shows the finding, and stop reading there."

first_false_positive: >-
  A sample or fixture file whose contents look exactly like configuration and
  whose values were never real. The file is published carelessly and discloses
  nothing, which is why a value is checked for being live before it is reported.

done_when: >-
  Every unlinked file found is recorded as carrying something unpublishable,
  with the excerpt that shows it, or as carrying only what the application
  already publishes.
