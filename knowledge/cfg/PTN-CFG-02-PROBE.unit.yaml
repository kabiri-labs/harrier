id: PTN-CFG-02-PROBE
topic: PTN-CFG-02
status: sketched
role: stage
title: "A file served that the application does not link"
objective: >-
  Determine whether the server returns a file that no page references and that
  the application does not need to publish.

requires:
  all_of: [recon.entrypoints.mapped]
motivated_by: [recon.paths.indexed]
yields: [surface.file.unlinked]

hypotheses:
  - "An editor or a deployment left a copy beside the file it copied, and the server serves whatever is in the directory."
  - "A directory named for backups or deployment is often browsable, and often not."
  - "A version control directory left in the served tree exposes the tree it tracks rather than only itself."
  - "A friendly error page returns a success status for anything, which makes status alone useless here."

triage:
  - "Names already served, with an editor, backup or archive suffix appended: bak, old, orig, save, swp, and the trailing tilde."
  - "Directories named for backup, old, deployment or artefacts."
  - "Version control and dependency metadata directories inside the served tree: git, svn, hg, and the dotfiles beside them such as env."
  - "A response whose length differs from the baseline for a non-existent path."

sink: >-
  The server's static file handler, which maps a request path onto a file in the
  served directory without the application deciding anything about it.

oracle:
  positive: "The server returns a file no page references and the application does not need to publish -- a backup or editor copy, an archive of the deployment, a configuration file, or a version control directory."
  negative: "Every candidate derived from the observed naming was requested and each answers as the baseline for a non-existent path does."

sequence:
  - "Request each candidate at the rate the engagement permits, keeping the baseline for a non-existent path beside the results."
  - "Judge each answer on body and length against that baseline rather than on status alone, since a friendly error page returns a success status for anything."
  - "For each hit, record the URL, the type, the length and a short excerpt that shows what kind of file it is."
  - "Stop at establishing that the file is served; what it carries is the next unit's question."

first_false_positive: >-
  A response that looks like a hit because it is long and successful, and is the
  application's catch-all page for anything unmatched. Comparing length against
  the recorded baseline separates the two before anything is downloaded.

done_when: >-
  Every candidate has been requested once, and each is recorded as served with
  its type and length, or as matching the baseline for a path that does not
  exist.
