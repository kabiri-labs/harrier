id: PTN-CFG-05
title: "Browser-directed security headers"
domain: CFG
axis: property

surfaces:
  always: true

order:
  - PTN-CFG-05-POLICY
  - PTN-CFG-05-SCOPE
  - PTN-CFG-05-VALIDATION

boundaries:
  - subject: "Bypassing a content security policy to land script"
    home: PTN-CLT-01
    note: >-
      A weak policy is a defence-in-depth gap with no victim; defeating one to
      execute script is a client-side finding.
  - subject: "Cross-origin sharing headers"
    home: PTN-CLT-06
    note: >-
      Those are exploited in a victim's browser rather than read off a
      response, so they are filed where the impact lands.

see_also: [PTN-CLT-01, PTN-CLT-06, PTN-CLT-08, PTN-CRY-01]

refs:
  wstg: [WSTG-CONF-07, WSTG-CONF-12, WSTG-CONF-14]
  cwe: [693, 1021]
