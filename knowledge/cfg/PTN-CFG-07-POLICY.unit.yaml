id: PTN-CFG-07-POLICY
topic: PTN-CFG-07
status: sketched
role: stage
title: "Ownership and mode of the deployed files"
objective: >-
  Determine, where the engagement grants access to the host, whether the
  ownership and mode of the application's files and directories give the
  serving process, or any other account on the host, more than it needs.

requires:
  all_of: [access.host]
yields: [control.permissions.excessive]
closes: [control.permissions.excessive]

hypotheses:
  - "The serving account can write where it only ever reads, because a deployment step needed write once and nobody narrowed it afterwards."
  - "A directory's mode decides more than the file's: a writable directory allows replacement of a file whose own mode looks correct."
  - "Accounts with no part in serving the application can read its configuration, because the mode was set for a group rather than for a purpose."

triage:
  - "Which account the serving process actually runs as, rather than which one the documentation says."
  - "Paths the application never writes to that the serving account can write."
  - "Directories rather than files, since replacement does not need the file to be writable."
  - "Configuration files readable beyond the account that serves them."

oracle:
  positive: "A file or directory the application deploys is writable by the account that serves it, or readable by an account on the host that has no part in serving it."
  negative: "Every deployed path was listed with its owner and mode, and each grants the serving account read where it needs read and write only where the application must write."

sequence:
  - "List the application's deployed tree with owner, group and mode, and establish which account the serving process actually runs as."
  - "Separate the paths the application must write from the ones it only reads, using what the application does rather than what the directory is called."
  - "Record every path the serving account can write but never writes to, and every path readable by accounts with no part in serving the application."
  - "Check the directories as well as the files: a writable directory allows replacement of a file whose own mode looks correct."

first_false_positive: >-
  A permissive mode on a path the application genuinely writes -- an upload
  directory, a cache, a socket. Writability there is the design, so the finding
  is writability where the application never writes, which is why the two lists
  are separated before anything is judged.

done_when: >-
  Every path in the deployed tree is recorded with its owner and mode against
  whether the application reads or writes it, and each excess is named with the
  account that holds it.
