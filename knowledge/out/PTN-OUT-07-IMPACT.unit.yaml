id: PTN-OUT-07-IMPACT
topic: PTN-OUT-07
status: outline
role: stage
kind: inquiry
title: "What the unearned entitlement delivers"
objective: >-
  Establish what the caller actually obtains by acting outside their claim:
  a function performed, a guard satisfied while the action received
  something else, or a limit passed -- and whether what it delivered
  survives.

requires:
  any_of:
    - primitive.privileged.action
    - primitive.check.bypassed
    - primitive.limit.exceeded
yields: [impact.entitlement.gained]
