id: PTN-OUT-01-IMPACT
topic: PTN-OUT-01
status: authored
role: stage
kind: inquiry
title: "What the readable data is worth"
objective: >-
  Establish what the reachable records actually contain -- whether personal,
  regulated, credential or commercial material is among them, and at what
  scale -- since a read is a finding in proportion to what it returns and
  not to the route that reached it.

requires:
  any_of:
    - primitive.db.read
    - primitive.doc.read
    - primitive.directory.read
    - primitive.memory.read
    - primitive.data.read.bulk
    - primitive.data.read.tenant
    - primitive.data.read.victim
    - primitive.fetch.readable
    - primitive.crypto.decrypt
    - primitive.fs.read
    - primitive.data.read.peer
yields: [impact.data.disclosed]

enter_when:
  - "A read has been confirmed by any route, and what it returns has not yet been characterised."

questions:
  - "What categories are in the reachable records: personal, regulated, credential, commercial, or operational detail with no external subject?"
  - "How many subjects does the reachable set concern -- one, the tester's own, a tenant, or the whole store?"
  - "Does the reachable set include material whose disclosure carries a statutory notification duty, which changes who has to be told and when?"
  - "Is any of it credential material that would extend the compromise rather than only evidence it?"
  - "What is the smallest observation that establishes each answer, and has anything larger been retrieved than that?"
  - "Would the client's own logs show what was retrieved, so the report and their record agree?"

first_false_positive: >-
  A schema read as the data. Table and column names establish that the store is
  reachable and say nothing about what is in it -- a column called ssn may be
  empty in every row, and a column called notes may not be. The answer comes
  from what a bounded sample contains, never from what a name implies.

preconditions:
  - "A confirmed read, and an agreed limit on how much may be retrieved to answer these questions."
  - "A handling route for anything retrieved: where it is stored, who sees it, and when it is destroyed."

evidence:
  - "The category answers, each with the smallest observation that established it."
  - "A record of exactly what was retrieved, so the client's account of the engagement and the tester's agree."

done_when: >-
  Each of the six questions is answered from a bounded observation, or recorded
  as unanswerable within the agreed retrieval limit with the reason -- and the
  total retrieved is written down against that limit.

safety: >-
  Every question here is answerable from metadata, a row count, or a single
  field, and answering it with a bulk retrieval converts the engagement into the
  disclosure it was hired to find. Retrieved material is the client's, is held
  only as long as the report needs it, and is destroyed on a schedule agreed
  before anything was read.

card: cards/outcome/proportionate-demonstration.md
