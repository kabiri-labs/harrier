id: HRR-ACL-02-IMPACT
topic: HRR-ACL-02
status: authored
role: stage
title: "How much of the object space a confirmed failure reaches"
objective: >-
  Determine whether the identifier space of a confirmed access-control failure
  can be addressed at scale, rather than one identifier at a time.

requires:
  all_of: [primitive.data.read.peer]
yields: [primitive.data.read.bulk]

hypotheses:
  - "The identifier is sequential, or decodes to something sequential, so the space is walked rather than searched."
  - "A list, search or export route returns many objects for one request, which reaches the space without walking it at all."
  - "A rate limit or an anomaly control stands between the tester and the space, and its behaviour is itself the finding."

triage:
  - "A list or export route accepting a page size, a filter or a date range, which returns many objects for one request."
  - "Two identifiers issued in sequence to the same account, whose difference says how the space is ordered."
  - "A search route accepting a wildcard, an empty filter or an unbounded range."

sink: >-
  The query that selects a set of objects rather than one, where the caller
  influences how large the set is.

enter_when:
  - "A single-object read across an ownership boundary has already been confirmed."

oracle:
  positive: "One request returns objects belonging to principals other than the caller, or a bounded series of adjacent identifiers is served in full."
  negative: "Adjacent identifiers are refused, list routes are scoped to the caller, and no route accepts an unbounded filter."
  inconclusive: "A rate limit stopped the series before enough of it was answered to distinguish a scoped space from a slow one."

sequence:
  - "Try the list, search and export routes first: one request that returns many objects settles the question without walking anything."
  - "Where none exists, request a short bounded series of adjacent identifiers -- a handful, not a sweep -- and record how many were served."
  - "Stop at the first refusal or the agreed ceiling, whichever comes first."
  - "Record the reachable proportion as a bounded estimate with the sample it came from, never as a total."

first_false_positive: >-
  A sequence of successes read as the whole space. A handful of adjacent
  identifiers being served says the space is walkable there, and says nothing
  about its size -- an estimate that outruns its sample is the claim that turns
  a real finding into an unreliable report.

false_positives:
  - "A list route that appears unscoped and is scoped by a filter the client always sends, so removing the filter returns an error rather than everything."
  - "Identifiers that were all created by the engagement itself, so the series proves the space is dense rather than that it belongs to others."

preconditions:
  - "A confirmed single-object failure, since scale is a property of a failure that already exists."
  - "An agreed ceiling on how many records may be addressed, set before the first request."

evidence:
  - "The single request returning objects of other principals, or the bounded series with the count served and the point it stopped."

done_when: >-
  The reachable proportion is recorded as a bounded estimate with the sample and
  the ceiling it was taken under, or the space is recorded as scoped with the
  routes that were tried.

safety: >-
  This is the unit that can turn an engagement into the breach it was hired to
  prevent. Enumeration touches real customers' records, so the ceiling is agreed
  in writing before the first request, the series is a sample and never a sweep,
  and no retrieved record is stored beyond the count and the identifier. Where a
  route would return the whole space in one request, the finding is that it
  would -- not the response.

payloads: payloads/access-control/identifiers.yaml
tools: [burp-repeater]
card: cards/access-control/object-ownership.md
mitigation: mitigations/object-authorization.md
